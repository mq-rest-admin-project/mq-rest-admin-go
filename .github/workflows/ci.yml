# https://github.com/vergil-project/vergil-actions/blob/develop/.github/workflows/README.md
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      go-versions:
        description: >-
          JSON array of Go versions for the unit-test matrix.
          Default (empty) runs the full matrix: ["1.25", "1.26"].
        type: string
        default: ""
      integration-matrix:
        description: >-
          JSON array of objects for the integration-test matrix.
          Default (empty) runs the full matrix with per-version ports.
        type: string
        default: ""
      run-security:
        description: >-
          Run security scanner jobs (set to 'false' to skip).
        type: string
        default: "true"
      run-release:
        description: >-
          Run release gate checks (set to 'false' to skip).
        type: string
        default: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: vergil-project/vergil-actions/.github/workflows/ci-audit.yml@v2.1
    with:
      language: go
      versions: ${{ inputs.go-versions || '["1.25", "1.26"]' }}
      container-suffix: go

  integration-tests:
    name: "test / integration / ${{ matrix.go-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.integration-matrix || '[{"go-version":"1.25","project-suffix":"1-25","qm1-rest-port":"9465","qm2-rest-port":"9466","qm1-mq-port":"1436","qm2-mq-port":"1437"},{"go-version":"1.26","project-suffix":"1-26","qm1-rest-port":"9467","qm2-rest-port":"9468","qm1-mq-port":"1438","qm2-mq-port":"1439"}]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Setup MQ environment
        uses: mq-rest-admin-project/mq-rest-admin-dev-environment/.github/actions/setup-mq@main
        with:
          project-name: mqrest-go-${{ matrix.project-suffix }}
          qm1-rest-port: ${{ matrix.qm1-rest-port }}
          qm2-rest-port: ${{ matrix.qm2-rest-port }}
          qm1-mq-port: ${{ matrix.qm1-mq-port }}
          qm2-mq-port: ${{ matrix.qm2-mq-port }}

      - name: Run integration tests
        env:
          MQ_REST_BASE_URL: https://localhost:${{ matrix.qm1-rest-port }}/ibmmq/rest/v2
          MQ_REST_BASE_URL_QM2: https://localhost:${{ matrix.qm2-rest-port }}/ibmmq/rest/v2
        run: |
          MQ_REST_ADMIN_RUN_INTEGRATION=1 \
          MQ_SKIP_LIFECYCLE=1 \
          go test -race -count=1 -tags=integration ./...

  quality:
    uses: vergil-project/vergil-actions/.github/workflows/ci-quality.yml@v2.1
    with:
      language: go
      versions: ${{ inputs.go-versions || '["1.25", "1.26"]' }}

  security:
    uses: vergil-project/vergil-actions/.github/workflows/ci-security.yml@v2.1
    with:
      language: go
      run-standards: ${{ inputs.run-release != 'false' }}
      run-security: ${{ inputs.run-security != 'false' }}
    permissions:
      contents: read
      security-events: write

  test:
    uses: vergil-project/vergil-actions/.github/workflows/ci-test.yml@v2.1
    with:
      language: go
      versions: ${{ inputs.go-versions || '["1.25", "1.26"]' }}
      container-suffix: go

  version:
    uses: vergil-project/vergil-actions/.github/workflows/ci-version-bump.yml@v2.1
    with:
      language: go
      run-release: ${{ inputs.run-release != 'false' }}
